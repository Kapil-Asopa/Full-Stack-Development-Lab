<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- External CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

<div class="card form-card p-4 shadow-lg">
<h2 class="text-center mb-4" id="formTitle">Student Registration</h2>

<form id="registrationForm">

<div class="mb-3">
<label>Username</label>
<input type="text" class="form-control input-field" id="username">
<small class="error"></small>
</div>

<div class="mb-3">
<label>Email</label>
<input type="text" class="form-control input-field" id="email">
<small class="error"></small>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input type="text" class="form-control input-field" id="phone">
<small class="error"></small>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control input-field" id="password">
<small class="error"></small>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input type="password" class="form-control input-field" id="confirmPassword">
<small class="error"></small>
</div>

<button type="submit" class="btn btn-primary w-100" id="submitBtn">Register</button>
</form>

<!-- Image Change Section -->
<div class="text-center mt-4">
<img src="https://via.placeholder.com/150" id="profileImg" class="rounded-circle">
<br><br>
<button class="btn btn-secondary" onclick="changeImage()">Change Image</button>
</div>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
